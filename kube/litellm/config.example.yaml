# Copy to ~/.cranopener/litellm/config.yaml and replace every PLACEHOLDER.
# Real endpoints and model identifiers never belong in this repository.

model_list:
  - model_name: provider-b/PLACEHOLDER-MODEL
    litellm_params:
      model: openai/PLACEHOLDER-UPSTREAM-MODEL
      api_base: https://PLACEHOLDER-PROVIDER-B-HOST/v1
      api_key: os.environ/PROVIDER_B_API_KEY

  - model_name: provider-c/PLACEHOLDER-MODEL
    litellm_params:
      model: openai/PLACEHOLDER-UPSTREAM-MODEL
      api_base: http://PLACEHOLDER-PROVIDER-C-HOST:8000/v1
      api_key: os.environ/PROVIDER_C_API_KEY

  # Provider A: no native tool calling, so it is driven by OpenHands rather
  # than opencode. The shim this entry once waited on was cancelled; the model
  # name still has to carry the `provider-a/` prefix, because that prefix is
  # what routes the session to the right harness.
  - model_name: provider-a/PLACEHOLDER-MODEL
    litellm_params:
      model: openai/PLACEHOLDER-UPSTREAM-MODEL
      api_base: https://PLACEHOLDER-PROVIDER-A-HOST/v1
      api_key: os.environ/PROVIDER_A_API_KEY

litellm_settings:
  # OpenHands owns prompt-mode tool calling, in the session container. If the
  # gateway also injected tool definitions the prompts would double and the
  # output become unparseable, presenting as a model defect rather than a
  # configuration one. (This once read "the shim owns" -- the shim was
  # cancelled and the harness took the job.)
  add_function_to_prompt: false
  num_retries: 3
  request_timeout: 300

  # WARNING: these two keys are NOT enforced by this stack. LiteLLM tracks
  # spend in Postgres and this pod provisions none, so they are inert until
  # DATABASE_URL points at a reachable database -- an unattended agent against
  # a metered endpoint runs until it finishes or you stop it.
  #
  # Left here, correctly placed, so that adding a database is the only step
  # needed to make them real. Until then bound runs another way: a token limit
  # on the key at the provider, CRANOPENER_MAX_ITERATIONS, or supervision.
  max_budget: 50
  budget_duration: 30d
