# Refuse to publish anything this repository must not carry.
#
# The same check the pre-push hook runs, so a push that bypassed the hook --
# --no-verify, a clone that never ran install-hooks.sh, the GitHub web editor --
# still fails here.
#
# Scope, deliberately: this scans the working tree, not history. A secret that
# was committed and later removed stays in history and is not caught here, and
# the fix for that is rotation rather than a scan. GitHub's own secret scanning
# covers history for public repositories and should be left enabled.
#
# The site-specific rule (docs/secret-denylist.txt) cannot run here -- docs/ is
# gitignored, which is exactly why the real identifiers live in it. CI catches
# the structural leaks; the pre-push hook catches this site's own.
# Named secret-check, not secrets: .gitignore carries `secrets.*` to keep
# credential files out, and a workflow called secrets.yml is silently ignored
# by it -- present on disk, absent from the repository, never run.
name: secret-check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for secrets
        run: bash scripts/check-secrets.sh
