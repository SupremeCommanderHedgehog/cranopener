name: build

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "Pin a specific opencode version (blank = latest)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - Dockerfile
      - config/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - scripts/**
      - .github/workflows/**

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The resolver tests skip themselves when jq is absent, so CI must prove
      # jq exists — otherwise a silent skip would look identical to a pass.
      - name: Assert jq is available
        run: jq --version
      - name: Run shell unit tests
        run: bash tests/run-all.sh

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Compute image reference (GHCR requires lowercase)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/cranopener" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Resolve tool versions
        id: versions
        env:
          OPENCODE_VERSION_OVERRIDE: ${{ inputs.opencode_version }}
        run: |
          bash scripts/resolve-versions.sh | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cranopener:ci
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
            GO_VERSION=${{ steps.versions.outputs.GO_VERSION }}
            JULIA_VERSION=${{ steps.versions.outputs.JULIA_VERSION }}
            JULIA_URL=${{ steps.versions.outputs.JULIA_URL }}
            JULIA_SHA256=${{ steps.versions.outputs.JULIA_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          CONTAINER_ENGINE: docker
          EXPECT_OPENCODE_VERSION: ${{ steps.versions.outputs.OPENCODE_VERSION }}
        run: bash scripts/smoke-test.sh cranopener:ci

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ steps.versions.outputs.OPENCODE_VERSION }}
            ${{ steps.img.outputs.ref }}:${{ steps.versions.outputs.OPENCODE_VERSION }}-${{ github.sha }}
            ${{ steps.img.outputs.ref }}:sha-${{ github.sha }}
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
            GO_VERSION=${{ steps.versions.outputs.GO_VERSION }}
            JULIA_VERSION=${{ steps.versions.outputs.JULIA_VERSION }}
            JULIA_URL=${{ steps.versions.outputs.JULIA_URL }}
            JULIA_SHA256=${{ steps.versions.outputs.JULIA_SHA256 }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## cranopener build"
            echo ""
            echo "| Tool | Version |"
            echo "|---|---|"
            echo "| opencode | ${{ steps.versions.outputs.OPENCODE_VERSION }} |"
            echo "| Go | ${{ steps.versions.outputs.GO_VERSION }} |"
            echo "| Julia | ${{ steps.versions.outputs.JULIA_VERSION }} |"
          } >> "$GITHUB_STEP_SUMMARY"
