name: build

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "Pin a specific opencode version (blank = latest)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - Dockerfile
      - config/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - scripts/**
      - .github/workflows/**

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The resolver tests skip themselves when jq is absent, so CI must prove
      # jq exists — otherwise a silent skip would look identical to a pass.
      - name: Assert jq is available
        run: jq --version
      - name: Run shell unit tests
        run: bash tests/run-all.sh

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Compute image reference (GHCR requires lowercase)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/cranopener" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Resolve tool versions
        id: versions
        env:
          OPENCODE_VERSION_OVERRIDE: ${{ inputs.opencode_version }}
        run: |
          bash scripts/resolve-versions.sh | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # ---------------------------------------------------------------------
      # Pull requests: build locally and smoke test. Never push, never write
      # cache — a fork PR must not be able to influence what main publishes.
      # ---------------------------------------------------------------------
      - name: Build image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: cranopener:ci
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
            GO_VERSION=${{ steps.versions.outputs.GO_VERSION }}
            JULIA_VERSION=${{ steps.versions.outputs.JULIA_VERSION }}
            JULIA_URL=${{ steps.versions.outputs.JULIA_URL }}
            JULIA_SHA256=${{ steps.versions.outputs.JULIA_SHA256 }}
          cache-from: type=gha

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request'
        env:
          CONTAINER_ENGINE: docker
          EXPECT_OPENCODE_VERSION: ${{ steps.versions.outputs.OPENCODE_VERSION }}
        run: bash scripts/smoke-test.sh cranopener:ci

      # ---------------------------------------------------------------------
      # Everything else: push ONCE to a staging tag, smoke test that exact
      # digest, then promote the tested digest to the release tags.
      #
      # This image pins no tool versions by design, so building a second time
      # in order to push could publish a different toolchain than the one that
      # was tested. Building once and promoting by digest makes it impossible
      # to publish anything other than the artifact that passed.
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}:staging
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
            GO_VERSION=${{ steps.versions.outputs.GO_VERSION }}
            JULIA_VERSION=${{ steps.versions.outputs.JULIA_VERSION }}
            JULIA_URL=${{ steps.versions.outputs.JULIA_URL }}
            JULIA_SHA256=${{ steps.versions.outputs.JULIA_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test the exact pushed digest
        if: github.event_name != 'pull_request'
        env:
          CONTAINER_ENGINE: docker
          EXPECT_OPENCODE_VERSION: ${{ steps.versions.outputs.OPENCODE_VERSION }}
        run: |
          set -euo pipefail
          TESTED="${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}"
          echo "testing $TESTED"
          docker pull "$TESTED"
          bash scripts/smoke-test.sh "$TESTED"

      - name: Promote the tested digest to release tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          REF='${{ steps.img.outputs.ref }}'
          VER='${{ steps.versions.outputs.OPENCODE_VERSION }}'
          SHA='${{ github.sha }}'
          docker buildx imagetools create \
            --tag "${REF}:latest" \
            --tag "${REF}:${VER}" \
            --tag "${REF}:${VER}-${SHA}" \
            --tag "${REF}:sha-${SHA}" \
            "${REF}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.img.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## cranopener build"
            echo ""
            echo "| Tool | Version |"
            echo "|---|---|"
            echo "| opencode | ${{ steps.versions.outputs.OPENCODE_VERSION }} |"
            echo "| Go | ${{ steps.versions.outputs.GO_VERSION }} |"
            echo "| Julia | ${{ steps.versions.outputs.JULIA_VERSION }} |"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
