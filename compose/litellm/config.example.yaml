# Copy to ~/.cranopener/litellm/config.yaml and replace every PLACEHOLDER.
# Real endpoints and model identifiers never belong in this repository.

model_list:
  - model_name: capra/PLACEHOLDER-MODEL
    litellm_params:
      model: openai/PLACEHOLDER-UPSTREAM-MODEL
      api_base: https://PLACEHOLDER-CAPRA-HOST/v1
      api_key: os.environ/CAPRA_API_KEY

  - model_name: dgx/PLACEHOLDER-MODEL
    litellm_params:
      model: openai/PLACEHOLDER-UPSTREAM-MODEL
      api_base: http://PLACEHOLDER-DGX-HOST:8000/v1
      api_key: os.environ/DGX_API_KEY

  # Added in Phase 2, once the shim exists. A model without native tool
  # calling, reached directly by opencode, fails on its first tool call.
  # - model_name: genai/PLACEHOLDER-MODEL
  #   litellm_params:
  #     model: openai/PLACEHOLDER-UPSTREAM-MODEL
  #     api_base: https://PLACEHOLDER-GENAI-HOST/v1
  #     api_key: os.environ/GENAI_API_KEY

litellm_settings:
  # The shim owns prompt-mode tool calling. If both layers inject tool
  # definitions the prompts double and the output becomes unparseable, and it
  # presents as a model defect rather than a configuration one.
  add_function_to_prompt: false
  num_retries: 3
  request_timeout: 300

general_settings:
  # An agent looping unattended against a metered endpoint can spend a lot
  # overnight. This is the backstop.
  max_budget: 50
  budget_duration: 30d
