# Bypass stack: opencode alone, using its own stock providers.
#
# Standalone by necessity. Compose override files merge and cannot remove a
# service, so layering this on compose.yaml with -f could never drop litellm,
# and the base file's depends_on would keep pulling it back in. Select this
# file instead of compose.yaml, never alongside it.
services:
  opencode:
    image: ghcr.io/supremecommanderhedgehog/cranopener:latest
    volumes:
      - ${CRANOPENER_WORKSPACE}:/workspace
      - ./certs/extra-roots.pem:/etc/ssl/certs/extra-roots.pem:ro
      - ./opencode/opencode.direct.json:/home/opencode/.config/opencode/opencode.json:ro
      - ./opencode/AGENTS.md:/home/opencode/.config/opencode/AGENTS.md:ro
    environment:
      # See compose.yaml: config comes from the mounts, so seeding has nothing
      # to do and would warn on every launch.
      CRANOPENER_SEED_SRC: /nonexistent
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/extra-roots.pem
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    stdin_open: true
    tty: true
